name: Scaffold validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap development environment
        run: bash scripts/init-dev-ubuntu.sh
      - name: Validate scaffold
        run: bash scripts/check-scaffold.sh
