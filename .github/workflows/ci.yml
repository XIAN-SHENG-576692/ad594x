name: Register generation validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap development environment
        run: bash scripts/init-dev-ubuntu.sh
      - name: Validate repository structure
        run: bash scripts/check-scaffold.sh
      - name: Generate register headers and release packages
        run: .venv/bin/python scripts/generate_registers.py --releases
      - name: Verify metadata, naming, determinism, compilation and releases
        run: .venv/bin/python scripts/verify_registers.py
      - name: Upload verified release packages
        uses: actions/upload-artifact@v4
        with:
          name: register-release-packages
          path: |
            generated/releases/ad594x-registers.tar.gz
            generated/releases/ad594x-registers-prefix-template.tar.gz
          if-no-files-found: error

  release:
    needs: registers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release packages
        uses: actions/download-artifact@v4
        with:
          name: register-release-packages
          path: release-packages
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-packages/ad594x-registers.tar.gz \
            release-packages/ad594x-registers-prefix-template.tar.gz \
            --verify-tag --generate-notes
